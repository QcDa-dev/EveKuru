<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveKuru - 情報変更</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body class="antialiased">
    <div id="main-container" class="min-h-screen flex flex-col">
        <main class="flex-grow flex flex-col justify-center items-center p-4 pt-24">
            <div class="w-full max-w-md">
                 <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold text-primary">登録情報の変更</h1>
                </div>
                <div id="edit-message" class="mb-4 text-center"></div>
                <form class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="edit-lastName" placeholder="姓" class="input-field p-3 w-full">
                        <input type="text" id="edit-firstName" placeholder="名" class="input-field p-3 w-full">
                    </div>
                    <div>
                        <input type="email" id="edit-email" placeholder="メールアドレス" class="input-field p-3 w-full">
                    </div>
                    <button type="button" id="update-button" class="w-full btn-primary font-bold py-3 px-4 rounded-lg shadow-md">変更を保存</button>
                    <button type="button" id="back-to-card-button" class="w-full btn-secondary font-bold py-3 px-4 rounded-lg">戻る</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { initCommonPage, callGasApi, showMessage } from './common.js';
        
        function pageInit() {
            const user = JSON.parse(sessionStorage.getItem('EveKuruUser'));
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('edit-lastName').value = user.lastName;
            document.getElementById('edit-firstName').value = user.firstName;
            document.getElementById('edit-email').value = user.email;

            document.getElementById('back-to-card-button').addEventListener('click', () => {
                window.location.href = 'card.html' + window.location.search;
            });

            document.getElementById('update-button').addEventListener('click', async () => {
                const newLastName = document.getElementById('edit-lastName').value;
                const newFirstName = document.getElementById('edit-firstName').value;
                const newEmail = document.getElementById('edit-email').value;

                if (!newLastName || !newFirstName || !newEmail) {
                    showMessage('edit-message', 'すべての項目を入力してください。', true);
                    return;
                }

                const result = await callGasApi({
                    action: 'updateUserInfo',
                    currentUserID: user.userID,
                    newLastName,
                    newFirstName,
                    newEmail
                });
                
                if (result.success) {
                    const updatedUser = { ...user, lastName: newLastName, firstName: newFirstName, email: newEmail };
                    sessionStorage.setItem('EveKuruUser', JSON.stringify(updatedUser));
                    showMessage('edit-message', result.message, false);
                    setTimeout(() => { window.location.href = 'card.html' + window.location.search; }, 2000);
                } else {
                    showMessage('edit-message', result.message, true);
                }
            });
        }
        
        initCommonPage(pageInit);
    </script>
</body>
</html>
