<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveKuru - 登録情報の変更</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body class="antialiased">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4 pt-20">
        <main class="flex-grow flex flex-col justify-center">
            <div id="edit-screen">
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold text-primary">登録情報の変更</h1>
                </div>
                <div id="edit-message" class="mb-4 text-center"></div>
                <form class="space-y-4">
                    <div class="flex space-x-2">
                        <input type="text" id="last_name" placeholder="姓" class="input-field p-3 w-1/2" required>
                        <input type="text" id="first_name" placeholder="名" class="input-field p-3 w-1/2" required>
                    </div>
                    <input type="email" id="e-mail" placeholder="メールアドレス" class="input-field p-3" required>
                    <button type="button" id="update-button" class="w-full btn-primary font-bold py-3 px-4 rounded-lg shadow-md">変更を保存</button>
                    <button type="button" id="back-to-card-button" class="w-full btn-secondary font-bold py-3 px-4 rounded-lg">戻る</button>
                </form>
            </div>
        </main>
    </div>
    <div id="loader" class="loader-container hidden">
        <div class="loader-spinner"></div>
    </div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const eventParam = new URLSearchParams(window.location.search).toString();
            const user = JSON.parse(localStorage.getItem('EveKuruUser'));

            if (!user) {
                window.location.href = `index.html?${eventParam}`;
                return;
            }

            // 現在の情報をフォームに設定
            document.getElementById('last_name').value = user.lastName || '';
            document.getElementById('first_name').value = user.firstName || '';
            document.getElementById('e-mail').value = user.email || '';

            document.getElementById('update-button').addEventListener('click', async () => {
                const payload = {
                    currentUserID: user.userID,
                    newLastName: document.getElementById('last_name').value,
                    newFirstName: document.getElementById('first_name').value,
                    newEmail: document.getElementById('e-mail').value
                };

                if (!payload.newLastName || !payload.newFirstName || !payload.newEmail) {
                    return showMessage('edit-message', 'すべての項目を入力してください。', true);
                }
                
                const response = await callGasApi('updateUserInfo', payload);
                if (response.success) {
                    // localStorageのユーザー情報も更新
                    user.lastName = payload.newLastName;
                    user.firstName = payload.newFirstName;
                    user.email = payload.newEmail;
                    localStorage.setItem('EveKuruUser', JSON.stringify(user));

                    showMessage('edit-message', '情報を更新しました。');
                    setTimeout(() => window.location.href = `card.html?${eventParam}`, 2000);
                } else {
                    showMessage('edit-message', response.message, true);
                }
            });

            document.getElementById('back-to-card-button').addEventListener('click', () => {
                window.location.href = `card.html?${eventParam}`;
            });
        });
    </script>
</body>
</html>
