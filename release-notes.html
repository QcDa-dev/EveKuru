<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveKuru - リリースノート</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <style>
        .release-content h2 { @apply text-2xl font-bold mt-6 mb-2 border-b-2 pb-1; }
        .release-content h3 { @apply text-xl font-semibold mt-4 mb-2; }
        .release-content ul { @apply list-disc list-inside ml-4 space-y-1; }
        .release-content p { @apply my-2; }
    </style>
</head>
<body class="antialiased">
    <!-- ★★★ 修正箇所1: id="main-container" を追加 ★★★ -->
    <div id="main-container" class="min-h-screen flex flex-col">
        <main class="flex-grow p-4 pt-24">
            <div class="max-w-2xl mx-auto">
                <h1 class="text-3xl font-bold text-center mb-8 text-primary">リリースノート</h1>
                <div id="release-notes-container" class="space-y-8">
                    <!-- Releases loaded here -->
                </div>
                <div id="loading-releases" class="text-center py-10">
                    <p class="text-gray-500">リリース情報を読み込んでいます...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initCommonPage } from './common.js';

        function fetchReleases() {
            const GITHUB_USER = 'qcda-dev'; 
            const GITHUB_REPO = 'EveKuru'; // ご自身のリポジトリ名に変更してください
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases`;

            const container = document.getElementById('release-notes-container');
            const loader = document.getElementById('loading-releases');

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                    return response.json();
                })
                .then(releases => {
                    loader.classList.add('hidden');
                    if (releases.length === 0) {
                        container.innerHTML = '<p class="text-center text-gray-500">リリース情報はまだありません。</p>';
                        return;
                    }
                    releases.forEach(release => {
                        const releaseDate = new Date(release.published_at).toLocaleDateString('ja-JP');
                        const releaseElement = document.createElement('div');
                        releaseElement.className = 'bg-white p-6 rounded-lg shadow-md';
                        releaseElement.innerHTML = `
                            <div class="flex justify-between items-center mb-3">
                                <h2 class="text-2xl font-bold text-gray-800">${release.name || release.tag_name}</h2>
                                <span class="text-sm text-gray-500">${releaseDate}</span>
                            </div>
                            <div class="release-content text-gray-700">${marked.parse(release.body)}</div>
                        `;
                        container.appendChild(releaseElement);
                    });
                })
                .catch(error => {
                    loader.classList.add('hidden');
                    console.error('Error fetching release notes:', error);
                    container.innerHTML = '<p class="text-center text-red-500">リリース情報の取得に失敗しました。</p>';
                });
        }
        
        initCommonPage(fetchReleases);
    </script>
</body>
</html>
