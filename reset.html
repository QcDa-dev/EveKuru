<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveKuru - ID/パスワードのリセット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body class="antialiased">
    <div id="main-container" class="min-h-screen flex flex-col">
        <main class="flex-grow flex flex-col justify-center items-center p-4 pt-24">
            <div class="w-full max-w-md">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-primary" id="reset-title">ID/パスワードのリセット</h1>
                </div>
                <div id="reset-message" class="mb-4 text-center"></div>
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <form id="reset-form" class="space-y-4">
                        <!-- Dynamic content here -->
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initCommonPage, callGasApi, showMessage, navigateTo } from './common.js';
        
        function pageInit() {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode');
            const email = params.get('email');
            const form = document.getElementById('reset-form');
            const title = document.getElementById('reset-title');

            if (!mode || !email) {
                form.innerHTML = '<p class="text-center text-red-500">無効なURLです。</p>';
                return;
            }

            let formHTML = '';
            if (mode === 'id_reset') {
                title.textContent = 'IDのリセット';
                formHTML = `
                    <div><input type="password" id="currentPassword" placeholder="現在のパスワード" class="input-field p-3 w-full"></div>
                    <div><input type="text" id="new_ID" placeholder="新しいID" class="input-field p-3 w-full"></div>
                `;
            } else if (mode === 'password_reset') {
                title.textContent = 'パスワードのリセット';
                formHTML = `
                    <div><input type="text" id="currentID" placeholder="現在のID" class="input-field p-3 w-full"></div>
                    <div><input type="password" id="new_password" placeholder="新しいパスワード" class="input-field p-3 w-full"></div>
                `;
            } else if (mode === 'id_password_reset') {
                // ★★★ 修正箇所2: 本人確認用の姓・名入力欄を追加 ★★★
                title.textContent = 'IDとパスワードのリセット';
                formHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="lastName" placeholder="登録した姓" class="input-field p-3 w-full">
                        <input type="text" id="firstName" placeholder="登録した名" class="input-field p-3 w-full">
                    </div>
                    <div><input type="text" id="new_ID" placeholder="新しいID" class="input-field p-3 w-full"></div>
                    <div><input type="password" id="new_password" placeholder="新しいパスワード" class="input-field p-3 w-full"></div>
                `;
            }
            formHTML += '<button type="button" id="reset-button" class="w-full btn-primary font-bold py-3 px-4 rounded-lg shadow-md">登録</button>';
            form.innerHTML = formHTML;
            
            document.getElementById('reset-button').addEventListener('click', async () => {
                const payload = { action: 'resetCredential', mode, email };
                let validationError = false;

                if (mode === 'id_reset') {
                    payload.currentPassword = document.getElementById('currentPassword').value;
                    payload.newID = document.getElementById('new_ID').value;
                    if (!payload.currentPassword || !payload.newID) validationError = true;
                } else if (mode === 'password_reset') {
                    payload.currentID = document.getElementById('currentID').value;
                    payload.newPassword = document.getElementById('new_password').value;
                    if (!payload.currentID || !payload.newPassword) validationError = true;
                } else if (mode === 'id_password_reset') {
                    payload.lastName = document.getElementById('lastName').value;
                    payload.firstName = document.getElementById('firstName').value;
                    payload.newID = document.getElementById('new_ID').value;
                    payload.newPassword = document.getElementById('new_password').value;
                    if (!payload.lastName || !payload.firstName || !payload.newID || !payload.newPassword) validationError = true;
                }

                if (validationError) {
                    showMessage('reset-message', 'すべての項目を入力してください。', true);
                    return;
                }

                const result = await callGasApi(payload);
                if (result.success) {
                    showMessage('reset-message', result.message, false);
                    setTimeout(() => { navigateTo('index.html'); }, 3000);
                } else {
                    showMessage('reset-message', result.message, true);
                }
            });
        }
        
        initCommonPage(pageInit);
    </script>
</body>
</html>
