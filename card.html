<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveKuru - 会員証</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body class="antialiased">
    <div id="main-container" class="min-h-screen flex flex-col">
        <main class="flex-grow flex flex-col justify-center items-center p-4 pt-24">
            <div class="w-full max-w-md">
                <div class="text-center mb-6">
                    <h1 class="text-4xl font-bold text-primary">会員証</h1>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-lg w-full flex flex-col items-center">
                    <div class="w-48 h-48 mb-6 p-2 border-4 border-gray-100 rounded-lg">
                        <img id="qr-code" src="" alt="QR Code" class="w-full h-full object-contain">
                    </div>
                    <div class="text-center">
                        <p class="text-2xl font-bold" id="card-userID"></p>
                        <p class="text-gray-500 mt-1" id="card-email"></p>
                    </div>
                </div>
                <div class="mt-8 space-y-4">
                    <button type="button" id="goto-edit-button" class="w-full btn-primary font-bold py-3 px-4 rounded-lg shadow-md">登録情報の変更</button>
                    <button type="button" id="logout-button" class="w-full btn-secondary font-bold py-3 px-4 rounded-lg">ログアウト</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initCommonPage, navigateTo } from './common.js';
        
        function pageInit() {
            const user = JSON.parse(sessionStorage.getItem('EveKuruUser'));
            if (!user) {
                navigateTo('index.html');
                return;
            }

            document.getElementById('qr-code').src = user.qrCodeUrl;
            document.getElementById('card-userID').textContent = user.userID;
            document.getElementById('card-email').textContent = user.email;

            document.getElementById('goto-edit-button').addEventListener('click', () => {
                navigateTo('edit.html');
            });
            
            document.getElementById('logout-button').addEventListener('click', () => {
                sessionStorage.removeItem('EveKuruUser');
                navigateTo('index.html');
            });
        }
        
        initCommonPage(pageInit);
    </script>
</body>
</html>
