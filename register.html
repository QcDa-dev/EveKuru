<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveKuru - 新規登録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body class="antialiased">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4 pt-20">
        <main class="flex-grow flex flex-col justify-center">
            <div id="register-screen">
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold text-primary">新規登録</h1>
                    <p class="text-gray-500 mt-2">情報を入力してください</p>
                </div>
                <div id="register-message" class="mb-4 text-center"></div>
                <form class="space-y-4">
                    <input type="text" id="userID" placeholder="ID" class="input-field p-3" required>
                    <input type="password" id="password" placeholder="パスワード" class="input-field p-3" required>
                    <div class="flex space-x-2">
                        <input type="text" id="last_name" placeholder="姓" class="input-field p-3 w-1/2" required>
                        <input type="text" id="first_name" placeholder="名" class="input-field p-3 w-1/2" required>
                    </div>
                    <input type="email" id="e-mail" placeholder="メールアドレス" class="input-field p-3" required>
                    <button type="button" id="register-button" class="w-full btn-primary font-bold py-3 px-4 rounded-lg shadow-md">登録</button>
                    <button type="button" id="goto-login-button" class="w-full btn-secondary font-bold py-3 px-4 rounded-lg">ログイン画面へ</button>
                </form>
            </div>
        </main>
    </div>
    <div id="loader" class="loader-container hidden">
        <div class="loader-spinner"></div>
    </div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const eventParam = new URLSearchParams(window.location.search).toString();

            document.getElementById('register-button').addEventListener('click', async () => {
                const payload = {
                    userID: document.getElementById('userID').value,
                    password: document.getElementById('password').value,
                    lastName: document.getElementById('last_name').value,
                    firstName: document.getElementById('first_name').value,
                    email: document.getElementById('e-mail').value,
                };

                for (const key in payload) {
                    if (!payload[key]) {
                        return showMessage('register-message', 'すべての項目を入力してください。', true);
                    }
                }

                const response = await callGasApi('registerUser', payload);
                if (response.success) {
                    showMessage('register-message', '登録が完了しました！ログインページに移動します。');
                    setTimeout(() => window.location.href = `index.html?${eventParam}`, 2000);
                } else {
                    showMessage('register-message', response.message, true);
                }
            });

            document.getElementById('goto-login-button').addEventListener('click', () => {
                window.location.href = `index.html?${eventParam}`;
            });
        });
    </script>
</body>
</html>
