<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveKuru - ログイン</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body class="antialiased">
    <!-- ★★★ 修正箇所2: IDを追加 ★★★ -->
    <div id="main-container" class="min-h-screen flex flex-col">
        <main class="flex-grow flex flex-col justify-center items-center p-4 pt-24">
            <div class="w-full max-w-md">
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold text-primary">ログイン</h1>
                </div>
                <div id="login-message" class="mb-4 text-center"></div>
                <form class="space-y-4">
                    <div>
                        <input type="text" id="login-userID" placeholder="ID" class="input-field p-3 w-full">
                    </div>
                    <div>
                        <input type="password" id="login-password" placeholder="パスワード" class="input-field p-3 w-full">
                    </div>
                    <button type="button" id="login-button" class="w-full btn-primary font-bold py-3 px-4 rounded-lg shadow-md">ログイン</button>
                    <button type="button" id="goto-register-button" class="w-full btn-secondary font-bold py-3 px-4 rounded-lg">新規登録はこちら</button>
                </form>
                <div class="text-center mt-6 space-y-3">
                    <a href="forgot.html" class="text-sm text-primary hover:underline">ID・パスワードを忘れた方</a>
                    <br>
                    <a href="migration.html" class="text-sm text-gray-600 hover:text-primary hover:underline">QcDaからのアカウント移行について</a>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initCommonPage, callGasApi, showMessage } from './common.js';
        
        function pageInit() {
            document.getElementById('goto-register-button').addEventListener('click', () => {
                window.location.href = 'register.html' + window.location.search;
            });

            document.getElementById('login-button').addEventListener('click', async () => {
                const userID = document.getElementById('login-userID').value;
                const password = document.getElementById('login-password').value;

                if (!userID || !password) {
                    showMessage('login-message', 'IDとパスワードを入力してください。', true);
                    return;
                }

                const result = await callGasApi({ action: 'loginUser', userID, password });
                
                if (result.success) {
                    sessionStorage.setItem('EveKuruUser', JSON.stringify(result.user));
                    // ★★★ 修正箇所1: URLパラメータを引き継ぐ ★★★
                    window.location.href = 'card.html' + window.location.search;
                } else {
                    showMessage('login-message', result.message, true);
                }
            });
        }
        
        initCommonPage(pageInit);
    </script>
</body>
</html>
