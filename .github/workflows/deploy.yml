name: Deploy to GitHub PagesTrigger the workflow on pushes to the main branchon:push:branches:- mainjobs:build-and-deploy:# Use the latest version of Ubuntu as the runnerruns-on: ubuntu-lateststeps:# Step 1: Check out the repository's code- name: Checkout 🛎️uses: actions/checkout@v4  # Step 2: Deploy to GitHub Pages
  - name: Deploy 🚀
    uses: JamesIves/github-pages-deploy-action@v4
    with:
      branch: gh-pages # The branch the action should deploy to.
      folder: .       # The folder the action should deploy.
